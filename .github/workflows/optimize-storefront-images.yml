name: Optimize MaGelle image loading
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_storefront_media.py'
      - '.github/workflows/optimize-storefront-images.yml'
permissions:
  contents: write
concurrency:
  group: optimize-magelle-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow
      - name: Fetch verified exact-photo sources and render WebP
        run: python scripts/optimize_storefront_media.py
      - name: Check image references and scripting
        run: |
          node --check app.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('media/optimized-image-report.json').read_text())
          assert data['optimized'] >= 6, data
          m=Path('media/optimized-image-map.js').read_text()
          assert m.startswith('window.MaGelleOptimizedImageMap = ')
          for n in data['changed_pages']:
              h=Path(n).read_text()
              assert '/media/optimized-image-map.js' in h if '/app.js' in h else True, n
          print('PASS: optimized=',data['optimized'],'changed=',len(data['changed_pages']))
          PY
      - name: Commit optimized media and references
        run: |
          git config user.name "MaGelle optimization bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' media/optimized/ media/optimized-image-map.js media/optimized-image-report.json
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "perf: serve reviewed product photography as first-party WebP [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
