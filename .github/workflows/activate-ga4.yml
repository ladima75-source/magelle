name: Activate MaGelle GA4 ecommerce
on:
  push:
    branches: [main]
    paths:
      - 'scripts/activate_ga4_events.py'
      - '.github/workflows/activate-ga4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify app JS syntax
        run: node --check app.js
      - name: Set app.js version for all pages
        run: python scripts/activate_ga4_events.py
      - name: Commit activated script refs
        run: |
          git config user.name "MaGelle site automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m "chore: activate GA4 ecommerce on storefront [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
