name: Merchant feed sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: merchant-feed-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build feed from Admin 2.0
        run: python scripts/build_merchant_feed.py
      - name: Commit only changed feed
        run: |
          if git diff --quiet -- merchant.xml; then
            echo "No change in stock or price"
            exit 0
          fi
          git config user.name "MaGelle feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchant.xml
          git commit -m "chore: sync Merchant price and stock from Admin 2.0 [skip ci]"
          git push
