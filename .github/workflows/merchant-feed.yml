name: Merchant feed sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_merchant_feed.py'
      - 'scripts/verify_merchant_feed.py'
      - 'scripts/site_contract.py'
      - 'app.js'
      - 'media/exact/**'
      - 'organic-flare-*.html'
      - 'architectural-step-*.html'
      - 'sculptural-fold-*.html'
      - '.github/workflows/merchant-feed.yml'
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: merchant-feed-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser code syntax
        run: node --check app.js
      - name: Python feed syntax
        run: python -m py_compile scripts/build_merchant_feed.py scripts/verify_merchant_feed.py
      - name: Build feed from Admin 2.0
        run: python scripts/build_merchant_feed.py
      - name: Check XML, canonical, Product/Offer against price and photos
        run: python scripts/verify_merchant_feed.py
      - name: Commit changed Merchant feed
        run: |
          if git diff --quiet -- merchant.xml; then
            echo "No change in Merchant feed"
            exit 0
          fi
          git config user.name "MaGelle feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchant.xml
          git commit -m "chore: sync Merchant exact-SKU feed from Admin 2.0 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
