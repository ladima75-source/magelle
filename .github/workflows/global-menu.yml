name: Keep MaGelle navigation identical
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/sync_global_navigation.py'
permissions:
  contents: write
concurrency:
  group: global-menu-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_global_navigation.py
      - name: Commit only changed HTML navigation
        run: |
          if git diff --quiet -- '*.html'; then echo 'Navigation already uniform'; exit 0; fi
          git config user.name 'MaGelle navigation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'chore: synchronize shared website navigation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
