name: Install Plerdy on public website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/install_plerdy.py'
      - '.github/workflows/install-plerdy.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Plerdy on public HTML pages
        run: python scripts/install_plerdy.py
      - name: Commit all public page integrations
        run: |
          git config user.name "MaGelle site automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then echo 'Already installed'; exit 0; fi
          git commit -m "Add Plerdy snippet to every public page [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
