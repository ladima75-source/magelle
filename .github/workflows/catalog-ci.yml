name: Catalog safety
on: [push, pull_request]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s server -p test_catalog.py -v
      - run: python scripts/audit_static_site.py
      - run: node --check app.js && node --check server/static/admin2.js
