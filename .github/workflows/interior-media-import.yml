name: Import MaGelle interiors from published Instagram
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_interior_instagram.py'
permissions:
  contents: write
jobs:
  import-interiors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Import source-verified MaGelle Instagram first slides
        run: python scripts/import_interior_instagram.py
      - name: Store optimized media in repository
        run: |
          git config user.name "MaGelle media bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/interiors
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add sourced MaGelle Instagram interior visuals [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
