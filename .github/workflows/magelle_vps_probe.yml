name: MaGelle VPS Access Probe

on:
  push:
    branches: [main]
    paths:
      - 'ops/magelle-vps-probe.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.BB610_VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.BB610_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Probe approved gateway
        shell: bash
        env:
          VPS_HOST: ${{ secrets.BB610_VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          ssh -i ~/.ssh/vps -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@"$VPS_HOST" audit
