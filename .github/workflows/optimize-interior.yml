name: Optimize approved interior visual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media/koral_interior.png'
      - '.github/workflows/optimize-interior.yml'
permissions:
  contents: write
concurrency:
  group: magelle-interior-webp
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Convert only approved interior source to lightweight WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path("media/koral_interior.png")
          dst=Path("media/koral_interior.webp")
          if not src.exists():
              print("Source already optimized; no action needed.")
          else:
              with Image.open(src) as im:
                  im=im.convert("RGB")
                  im.save(dst, "WEBP", quality=83, method=6)
                  print(f"Interior WebP: {im.size}, {dst.stat().st_size} bytes")
              assert dst.stat().st_size < 350_000, "Unexpected output size"
              src.unlink()
          PY
      - name: Save first-party optimized visual
        run: |
          if git status --porcelain -- media/koral_interior.png media/koral_interior.webp | grep -q .; then
            git config user.name "MaGelle site bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A media/koral_interior.png media/koral_interior.webp
            git commit -m "perf: optimize approved Koral interior to WebP [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
